# 타깃 독자, 중요도 기준, 제외 조건 — 분야를 바꿀 때는 이 파일과 sources.yaml만 고친다.

field: 국내 증시·경제
newsletter_name: 장전 브리핑

persona: >
  국내 주식(코스피·코스닥)에 직접 투자하는 3~5년 차 직장인 개인 투자자.
  출근길 07:30~08:30에 휴대전화로 10분 안에 읽고,
  장 시작(09:00) 전에 오늘 시장과 내 보유 종목 판단에 영향을 줄 소식을 알고 싶어 한다.
  전문 용어는 알지만 원문 기사를 여러 개 찾아 읽을 시간은 없다.

# 선별 기준 — LLM 프롬프트에 그대로 들어가는 '중요도 판단 문장'
importance: 오늘 국내 증시나 개인 투자자의 보유 종목 판단에 실제로 영향을 줄 만한가

pick:
  - 금리·환율·유가·물가 같은 거시 지표의 변화, 또는 그 지표를 움직일 발표·결정
  - 정부·한국은행·금융당국의 정책·규제 결정 중 시행일이나 대상이 확정된 것
  - 수출입·업황·실적 발표처럼 한 업종 전체에 영향을 주는 소식
  - 외국인·기관 수급이나 해외 증시 급변처럼 오늘 장의 방향을 바꿀 수 있는 소식

exclude:
  - 개별 종목의 단순 시황(오늘 몇 % 올랐다/내렸다)만 전하는 기사
  - 증권사 리포트의 목표주가를 그대로 옮긴 기사
  - 행사·MOU·수상·인사·사회공헌 같은 홍보성 소식
  - 발표 예정·검토 중·로드맵만 있고 결정된 것이 없는 소식
  - 분양 홍보, 투자 권유성 광고 기사

# LLM에 보내기 전에 코드로 거르는 제목 패턴(비용 0, 항상 같은 결과)
exclude_title_patterns: ["[포토]", "[사진]", "[인사]", "[부고]", "[게시판]", "[표]", "[오늘의", "운세", "날씨", "[영상]", "특징주", "목표가", "목표주가"]

# 선별 근거로 남길 분류 라벨 — 기사마다 하나를 붙여 기록한다
categories: [금리·통화정책, 환율·외환, 증시·수급, 업황·실적, 정책·규제, 원자재·물가, 해외경제, 기타]

# 인사이트(why) 작성 규칙
insight_rule: >
  이 소식이 개인 투자자에게 왜 중요한지 딱 한 문장. 영향을 받을 업종·지표를 짚고,
  '오늘 확인해 볼 포인트'로 끝낸다. 특정 종목의 매수·매도 권유나 주가 예측은 쓰지 않는다.

numbers:
  hours: 24            # 수집 기간(time window)
  target: 5            # 최종 발행 건수 (3~5)
  batch: 40            # 예선 묶음 크기
  per_batch: 4         # 묶음마다 예선 통과 건수 (본선 후보를 30건 안팎으로)
  tier1_cap: 1         # 1차 소스(기관 보도자료) 우선 통과 상한
  per_source_cap: 2    # 한 매체가 최종에 들어갈 수 있는 최대 건수
  min_body: 600        # G1 본문 기준선(자)
  max_regen: 1         # 검수 탈락 시 재생성 횟수 — 그래도 떨어지면 스킵
  min_korean: 0.5      # 요약 속 한글 비율 하한(코드 검사)
  why_max: 120         # 인사이트 길이 상한(자, 코드 검사)

model: gpt-4.1-mini

# 사람 승인(HITL) 기준 — 발행 직전에 이 기준에 걸리는 기사가 하나라도 있으면 그 호를 멈추고 담당자 승인을 받는다.
review:
  number_check: true          # ① 헤드라인·요약의 숫자가 원문 본문에 없으면 멈춤 (원문 숫자를 반올림한 값은 통과 — v2)
  regen_check: true           # ② 검수 1차 불합격 후 다시 쓴 기사면 멈춤
  advice_ai: true             # ③ v3: 인사이트(why)가 투자 권유인지 AI가 예/아니오로 판정 (실패·가짜 LLM 모드면 아래 정규식)
  advice_patterns:            # ③ v2 정규식 — AI 판정의 예비 수단이자 비교 실험용
    - '(?<!순)매수(?!세)'      # v2: 순매수·순매도·매수세·매도세는 수급 사실 보도라 제외
    - '(?<!순)매도(?!세)'
    - '추천'
    - '(사|담아|팔아|모아)\s*(두|둘|놓)'   # v2: "담아 둘 만하다", "사 두자" 같은 말투
    - '비중\s*(확대|축소)'
    - '사(세요|야|라)\b'
    - '팔(아|세요|라)\b'
    - '담(으세요|아야)'
  expire_hour: 9              # 대기 건 운영 규칙: 그날 장 시작(09시)이 지나도록 승인되지 않으면 자동 반려
